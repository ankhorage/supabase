name: Task 145 prepare S3 recovery

on:
  push:
    branches:
      - feat/145-s3-backup-storage
    paths:
      - '.github/workflows/task-145-prepare.yml'
      - 'package.json'
      - 'src/**'
      - '.changeset/**'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/145-s3-backup-storage
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Refresh dependencies
        run: bun install

      - name: Format sources
        run: bun run format

      - name: Generate docs
        run: bun run docs

      - name: Run build
        run: bun run build

      - name: Run typecheck
        run: bun run check-types

      - name: Run lint
        run: bun run lint

      - name: Run Knip
        run: bun run knip:check

      - name: Run tests
        run: bun run test

      - name: Check changeset
        run: bun run changeset:status

      - name: Check formatting
        run: bun run format:check

      - name: Commit prepared artifacts
        run: |
          if git diff --quiet; then
            echo 'Branch artifacts already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: refresh s3 recovery artifacts'
          git push origin HEAD:feat/145-s3-backup-storage

name: Temporary docs sync

on:
  push:
    branches:
      - fix/38-local-bootstrap-credentials

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: fix/38-local-bootstrap-credentials
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate docs
        run: bun run docs

      - name: Commit generated docs
        shell: bash
        run: |
          if git diff --quiet -- README.md paradox; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md paradox
          git commit -m "docs(supabase): regenerate provider documentation"
          git push origin HEAD:fix/38-local-bootstrap-credentials

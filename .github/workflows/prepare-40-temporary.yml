name: Temporary #40 preparation

on:
  push:
    branches:
      - fix/40-vault-bootstrap-migration

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: fix/40-vault-bootstrap-migration
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch Vault bootstrap into the Supabase database workload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/platform-infrastructure/domain/createSupabaseWorkloads.ts')
          source = path.read_text()
          import_line = "import { SUPABASE_VAULT_MIGRATION_SQL } from '@ankhorage/supabase-vault/migrations';"
          if import_line not in source:
              marker = "} from '@ankhorage/contracts/infra';\n\n"
              if marker not in source:
                  raise SystemExit('Contracts import marker not found')
              source = source.replace(marker, marker + import_line + "\n\n", 1)

          migration_path = '/docker-entrypoint-initdb.d/migrations/99-ankhorage-supabase-vault.sql'
          if migration_path not in source:
              marker = """      {\n        path: '/docker-entrypoint-initdb.d/migrations/99-realtime.sql',\n        content: literal(SUPABASE_DATABASE_REALTIME_SQL),\n      },\n      ...restore.files,\n"""
              replacement = """      {\n        path: '/docker-entrypoint-initdb.d/migrations/99-realtime.sql',\n        content: literal(SUPABASE_DATABASE_REALTIME_SQL),\n      },\n      ...(context.desired.secretStore?.provider === 'supabase-vault'\n        ? [\n            {\n              path: '/docker-entrypoint-initdb.d/migrations/99-ankhorage-supabase-vault.sql',\n              content: literal(SUPABASE_VAULT_MIGRATION_SQL),\n            },\n          ]\n        : []),\n      ...restore.files,\n"""
              if marker not in source:
                  raise SystemExit('Database bootstrap marker not found')
              source = source.replace(marker, replacement, 1)

          path.write_text(source)
          PY
      - name: Refactor database bootstrap files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/platform-infrastructure/domain/createSupabaseWorkloads.ts')
          source = path.read_text()
          helper_name = 'createDatabaseBootstrapFiles'
          if f'function {helper_name}(' not in source:
              files_block = """    files: [\n      {\n        path: '/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql',\n        content: literal(SUPABASE_DATABASE_WEBHOOKS_SQL),\n      },\n      {\n        path: '/docker-entrypoint-initdb.d/init-scripts/99-roles.sql',\n        content: literal(SUPABASE_DATABASE_ROLES_SQL),\n      },\n      {\n        path: '/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql',\n        content: literal(SUPABASE_DATABASE_JWT_SQL),\n      },\n      {\n        path: '/docker-entrypoint-initdb.d/migrations/99-realtime.sql',\n        content: literal(SUPABASE_DATABASE_REALTIME_SQL),\n      },\n      ...(context.desired.secretStore?.provider === 'supabase-vault'\n        ? [\n            {\n              path: '/docker-entrypoint-initdb.d/migrations/99-ankhorage-supabase-vault.sql',\n              content: literal(SUPABASE_VAULT_MIGRATION_SQL),\n            },\n          ]\n        : []),\n      ...restore.files,\n    ],\n"""
              if files_block not in source:
                  raise SystemExit('Prepared database files block not found')
              source = source.replace(
                  files_block,
                  "    files: createDatabaseBootstrapFiles(context, restore.files),\n",
                  1,
              )
              marker = """/*** Keep the database alive while a configured first-boot restore waits for off-host backup data. */\nfunction createDatabaseHealth"""
              helper = """/*** Compose database bootstrap SQL, including selected provider-owned migrations. */\nfunction createDatabaseBootstrapFiles(\n  context: InfraExecutionContext,\n  restoreFiles: NonNullable<InfraWorkloadSpec['files']>,\n): NonNullable<InfraWorkloadSpec['files']> {\n  return [\n    {\n      path: '/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql',\n      content: literal(SUPABASE_DATABASE_WEBHOOKS_SQL),\n    },\n    {\n      path: '/docker-entrypoint-initdb.d/init-scripts/99-roles.sql',\n      content: literal(SUPABASE_DATABASE_ROLES_SQL),\n    },\n    {\n      path: '/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql',\n      content: literal(SUPABASE_DATABASE_JWT_SQL),\n    },\n    {\n      path: '/docker-entrypoint-initdb.d/migrations/99-realtime.sql',\n      content: literal(SUPABASE_DATABASE_REALTIME_SQL),\n    },\n    ...(context.desired.secretStore?.provider === 'supabase-vault'\n      ? [\n          {\n            path: '/docker-entrypoint-initdb.d/migrations/99-ankhorage-supabase-vault.sql',\n            content: literal(SUPABASE_VAULT_MIGRATION_SQL),\n          },\n        ]\n      : []),\n    ...restoreFiles,\n  ];\n}\n\n/*** Keep the database alive while a configured first-boot restore waits for off-host backup data. */\nfunction createDatabaseHealth"""
              if marker not in source:
                  raise SystemExit('Database health marker not found')
              source = source.replace(marker, helper, 1)
              path.write_text(source)
          PY
      - name: Install dependencies and refresh lockfile
        run: bun install
      - name: Autofix imports
        run: >-
          bun x ankhorage-eslint
          src/features/platform-infrastructure/domain/createSupabaseWorkloads.ts
          --fix --max-warnings=0
      - name: Regenerate documentation
        run: bun run docs
      - name: Format repository
        run: bun run format
      - name: Commit prepared changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No prepared changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(supabase): isolate database bootstrap files"
          git push origin HEAD:fix/40-vault-bootstrap-migration
      - name: Build
        run: bun run build
      - name: Check types
        run: bun run check-types
      - name: Lint
        run: bun run lint
      - name: Knip
        run: bun run knip:check
      - name: Changeset status
        run: bun run changeset:status
      - name: Format check
        run: bun run format:check
      - name: Tests
        run: bun run test

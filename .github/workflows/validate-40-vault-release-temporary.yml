name: Temporary #40 corrected Vault validation

on:
  push:
    branches:
      - fix/40-require-vault-0.3.3

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: fix/40-require-vault-0.3.3
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Wait for corrected Vault release
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            version="$(npm view @ankhorage/supabase-vault@0.3.3 version 2>/dev/null || true)"
            if [ "$version" = "0.3.3" ]; then
              echo "Registry ready: $version"
              exit 0
            fi
            echo "Registry not ready (attempt $attempt): ${version:-missing}"
            sleep 5
          done
          exit 1
      - name: Clear Bun install cache
        run: rm -rf ~/.bun/install/cache
      - name: Refresh lockfile
        run: bun install
      - name: Verify corrected Vault resolution
        run: |
          bun --eval '
          import { fileURLToPath } from "node:url";
          const root = await Bun.file("package.json").json();
          const range = root.dependencies?.["@ankhorage/supabase-vault"];
          const path = fileURLToPath(import.meta.resolve("@ankhorage/supabase-vault/package.json"));
          const vault = await Bun.file(path).json();
          if (typeof range !== "string" || !Bun.semver.satisfies(vault.version, range)) throw new Error(`Vault ${vault.version} does not satisfy ${range ?? "<missing>"}`);
          if (!Bun.semver.satisfies(vault.version, ">=0.3.3")) throw new Error(`Vault ${vault.version} predates the schema fix`);
          console.log(`Supabase Vault: ${vault.version} (${range})`);
          '
      - name: Generate docs
        run: bun run docs
      - name: Format
        run: bun run format
      - name: Commit lockfile and generated outputs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(supabase): sync corrected Vault release"
            git push origin HEAD:fix/40-require-vault-0.3.3
          fi
      - name: Build
        run: bun run build
      - name: Check types
        run: bun run check-types
      - name: Lint
        run: bun run lint
      - name: Knip
        run: bun run knip:check
      - name: Changeset status
        run: bun run changeset:status
      - name: Format check
        run: bun run format:check
      - name: Tests
        run: bun run test

name: Temporary credential fixture migration

on:
  push:
    branches:
      - fix/38-local-bootstrap-credentials

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: fix/38-local-bootstrap-credentials
          fetch-depth: 0

      - name: Migrate Contracts 21 credential fixtures
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'src/supabaseMetaHealth.test.ts': [(
                  """    credentials: {\n      resolveAsync: () => Promise.resolve(success({})),\n    },""",
                  """    credentials: {\n      findAsync: () => Promise.reject(new Error('Health projection must not find credentials.')),\n      resolveAsync: () => Promise.resolve(success({})),\n      persistAsync: () => Promise.reject(new Error('Health projection must not persist credentials.')),\n    },""",
              )],
              'src/supabaseNativeHealth.test.ts': [(
                  """    credentials: {\n      resolveAsync: () => Promise.resolve(success({ anonKey: 'anon-client-key' })),\n    },""",
                  """    credentials: {\n      findAsync: () => Promise.reject(new Error('Health projection must not find credentials.')),\n      resolveAsync: () => Promise.resolve(success({ anonKey: 'anon-client-key' })),\n      persistAsync: () => Promise.reject(new Error('Health projection must not persist credentials.')),\n    },""",
              )],
              'src/supabaseObjectStorageOwnership.test.ts': [(
                  """    credentials: { resolveAsync: () => successCredentials() },""",
                  """    credentials: {\n      findAsync: () => Promise.resolve({ ok: true, value: null, diagnostics: [] }),\n      resolveAsync: () => successCredentials(),\n      persistAsync: () => Promise.reject(new Error('Ownership projection must not persist credentials.')),\n    },""",
              )],
              'src/supabasePersistence.test.ts': [(
                  """    credentials: {\n      resolveAsync: () => Promise.reject(new Error('Persistence projection needs no credentials.')),\n    },""",
                  """    credentials: {\n      findAsync: () => Promise.reject(new Error('Persistence projection needs no credentials.')),\n      resolveAsync: () => Promise.reject(new Error('Persistence projection needs no credentials.')),\n      persistAsync: () => Promise.reject(new Error('Persistence projection needs no credentials.')),\n    },""",
              )],
              'src/supabaseRoleBackupFilter.test.ts': [(
                  """    credentials: {\n      resolveAsync: () => Promise.reject(new Error('Projection must not resolve credentials.')),\n    },""",
                  """    credentials: {\n      findAsync: () => Promise.reject(new Error('Projection must not find credentials.')),\n      resolveAsync: () => Promise.reject(new Error('Projection must not resolve credentials.')),\n      persistAsync: () => Promise.reject(new Error('Projection must not persist credentials.')),\n    },""",
              )],
              'src/supabaseRuntimeEndpoints.test.ts': [(
                  """    credentials: {\n      resolveAsync: () =>\n        Promise.resolve({""",
                  """    credentials: {\n      findAsync: () => Promise.resolve({ ok: true, value: null, diagnostics: [] }),\n      resolveAsync: () =>\n        Promise.resolve({""",
              ), (
                  """          diagnostics: [],\n        }),\n    },\n    secrets:""",
                  """          diagnostics: [],\n        }),\n      persistAsync: () => Promise.reject(new Error('Endpoint projection must not persist credentials.')),\n    },\n    secrets:""",
              )],
              'src/supabaseStudioHealth.test.ts': [(
                  """    credentials: {\n      resolveAsync: () => Promise.resolve({ ok: true, value: {}, diagnostics: [] }),\n    },""",
                  """    credentials: {\n      findAsync: () => Promise.reject(new Error('Health projection must not find credentials.')),\n      resolveAsync: () => Promise.resolve({ ok: true, value: {}, diagnostics: [] }),\n      persistAsync: () => Promise.reject(new Error('Health projection must not persist credentials.')),\n    },""",
              )],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected fixture block not found in {filename}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          bootstrap_path = Path('src/supabaseBootstrapCredentials.test.ts')
          bootstrap = bootstrap_path.read_text()
          old = """  expect(generated.postgresPassword.length).toBeGreaterThanOrEqual(32);\n  expect(generated.jwtSecret.length).toBeGreaterThanOrEqual(32);\n  expect(generated.realtimeSecretKeyBase.length).toBeGreaterThanOrEqual(64);\n  expect(generated.realtimeDatabaseEncryptionKey).toHaveLength(16);\n  expect(generated.pgMetaCryptoKey.length).toBeGreaterThanOrEqual(32);\n  verifyJwt(generated.anonKey, generated.jwtSecret, 'anon');\n  verifyJwt(generated.serviceRoleKey, generated.jwtSecret, 'service_role');"""
          new = """  const postgresPassword = requiredCredential(generated, 'postgresPassword');\n  const jwtSecret = requiredCredential(generated, 'jwtSecret');\n  const anonKey = requiredCredential(generated, 'anonKey');\n  const serviceRoleKey = requiredCredential(generated, 'serviceRoleKey');\n  const realtimeSecretKeyBase = requiredCredential(generated, 'realtimeSecretKeyBase');\n  const realtimeDatabaseEncryptionKey = requiredCredential(\n    generated,\n    'realtimeDatabaseEncryptionKey',\n  );\n  const pgMetaCryptoKey = requiredCredential(generated, 'pgMetaCryptoKey');\n  expect(postgresPassword.length).toBeGreaterThanOrEqual(32);\n  expect(jwtSecret.length).toBeGreaterThanOrEqual(32);\n  expect(realtimeSecretKeyBase.length).toBeGreaterThanOrEqual(64);\n  expect(realtimeDatabaseEncryptionKey).toHaveLength(16);\n  expect(pgMetaCryptoKey.length).toBeGreaterThanOrEqual(32);\n  verifyJwt(anonKey, jwtSecret, 'anon');\n  verifyJwt(serviceRoleKey, jwtSecret, 'service_role');"""
          if old not in bootstrap:
              raise SystemExit('Expected generated credential assertions not found')
          bootstrap = bootstrap.replace(old, new, 1)
          marker = """/*** Provide one complete provider-valid bundle for supplied-credential policy tests. */\nfunction validCredentialFixture()"""
          helper = """/*** Read one required credential field without weakening strict indexed access. */\nfunction requiredCredential(values: Readonly<Record<string, string>>, key: string): string {\n  const value = values[key];\n  if (value === undefined) throw new Error(`Expected generated credential field ${key}.`);\n  return value;\n}\n\n/*** Provide one complete provider-valid bundle for supplied-credential policy tests. */\nfunction validCredentialFixture()"""
          if marker not in bootstrap:
              raise SystemExit('Expected credential fixture marker not found')
          bootstrap_path.write_text(bootstrap.replace(marker, helper, 1))

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format migrated fixtures
        run: bun run format

      - name: Commit fixture migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "test(supabase): complete Contracts 21 credential fixtures"
          git push origin HEAD:fix/38-local-bootstrap-credentials

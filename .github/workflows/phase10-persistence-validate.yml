name: Phase 10 production persistence validation

on:
  push:
    branches:
      - fix/145-persist-postgres-config
    paths:
      - '.github/workflows/phase10-persistence-validate.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/145-persist-postgres-config
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply production persistence fix
        run: python3 .github/phase10-persistence-patch.py
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run knip:check
      - run: bun run changeset:status
      - run: bun run format
      - run: bun run test
      - run: bun run docs
      - run: bun run format:check
      - name: Persist validated fix
        run: |
          rm .github/phase10-persistence-patch.py
          rm .github/workflows/phase10-persistence-validate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src README.md paradox .changeset .github/phase10-persistence-patch.py .github/workflows/phase10-persistence-validate.yml
          git commit -m 'fix: persist Supabase Postgres config'
          git push origin HEAD:fix/145-persist-postgres-config

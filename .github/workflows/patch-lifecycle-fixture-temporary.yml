name: Temporary lifecycle fixture patch

on:
  push:
    branches:
      - fix/38-local-bootstrap-credentials

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: fix/38-local-bootstrap-credentials
          fetch-depth: 0

      - name: Migrate lifecycle credential fixtures
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/supabaseLifecycle.test.ts')
          text = path.read_text()
          text = text.replace(
              """        credentials: {\n          resolveAsync: () => Promise.resolve({ ok: true, value: {}, diagnostics: [] }),\n        },""",
              """        credentials: {\n          findAsync: () => Promise.resolve({ ok: true, value: {}, diagnostics: [] }),\n          resolveAsync: () => Promise.resolve({ ok: true, value: {}, diagnostics: [] }),\n          persistAsync: () => success(null),\n        },""",
          )
          text = text.replace(
              """    credentials: { resolveAsync: () => successCredentials() },""",
              """    credentials: {\n      findAsync: () => successCredentials(),\n      resolveAsync: () => successCredentials(),\n      persistAsync: () => success(null),\n    },""",
          )
          path.write_text(text)

      - name: Commit migrated fixture
        shell: bash
        run: |
          if git diff --quiet -- src/supabaseLifecycle.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/supabaseLifecycle.test.ts
          git commit -m "test(supabase): migrate lifecycle credential port fixture"
          git push origin HEAD:fix/38-local-bootstrap-credentials
